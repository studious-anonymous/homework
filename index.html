<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>homework - your favourite chess site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1411; --panel:#17201b; --panel2:#1d2822; --line:#2b3a31;
    --text:#efe9db; --muted:#8c998f; --accent:#d6aa52; --accent-ink:#241a05;
    --good:#6fb35a; --danger:#d9534f;
    --light:#ecd9b0; --dark:#a67b52;
    --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
    --body:'Inter','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;display:flex;flex-direction:column;align-items:center;position:relative;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:conic-gradient(#ffffff0b 25%,transparent 0 50%,#ffffff0b 0 75%,transparent 0) 0 0/96px 96px;
    -webkit-mask:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);mask:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%)}
  button{font:inherit;border:0;cursor:pointer;color:inherit}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hidden{display:none!important}

  /* ---------- Lobby ---------- */
  #lobby{position:relative;width:100%;max-width:620px;padding:28px 16px 40px;display:flex;flex-direction:column;gap:22px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{width:46px;height:46px;filter:drop-shadow(0 4px 10px #000a)}
  .brand h1{margin:0;font-family:var(--display);font-size:1.45rem;line-height:1.15;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
  .brand{min-width:0;flex:1 1 280px}

  #livePanel .hint{color:var(--muted);font-size:.8rem;margin:-4px 0 14px}
  #liveList{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .live{display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .mini{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1;border-radius:6px;overflow:hidden}
  .mini i{display:block;position:relative;min-width:0;min-height:0}
  .mini i.l{background:var(--light)} .mini i.d{background:var(--dark)}
  .mini i.last::after{content:"";position:absolute;inset:0;background:#f6e05e77}
  .mini img{position:absolute;inset:0;width:100%;height:100%}
  .live .vs{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.9rem}
  .live .vs span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .live .vs em{font-style:normal;color:var(--muted);font-weight:400}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:.85rem;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .pill.on .dot{background:var(--good);box-shadow:0 0 0 4px #6fb35a22}
  .pill.on{color:var(--text)}

  .you{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
  .you input{width:150px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-weight:500}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
  .panel h2{margin:0 0 14px;font-family:var(--display);font-size:1.05rem;font-weight:500;letter-spacing:.02em;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
  .panel h2 span{font-family:var(--body);font-size:.85rem}

  .create{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);transition:transform .15s,border-color .15s,background .15s}
  .tile img{width:84px;height:84px;filter:drop-shadow(0 6px 10px #0009)}
  .tile b{font-family:var(--display);font-weight:500;font-size:1.05rem}
  .tile:hover:not(:disabled){transform:translateY(-3px);border-color:var(--accent);background:#222f28}
  .tile:disabled{opacity:.4;cursor:not-allowed}

  .waiting{display:flex;align-items:center;gap:16px;padding:6px 2px}
  .waiting img{width:64px;height:64px;filter:drop-shadow(0 6px 10px #0009)}
  .waiting .t{flex:1;font-family:var(--display);font-size:1.1rem}
  .spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite;display:inline-block;vertical-align:-3px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .btn{padding:10px 16px;border-radius:10px;font-weight:600;background:var(--accent);color:var(--accent-ink);transition:filter .15s}
  .btn:hover{filter:brightness(1.1)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--muted)}
  .btn.danger{background:var(--danger);color:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  #roomList{display:flex;flex-direction:column;gap:10px}
  .room{display:flex;align-items:center;gap:14px;padding:10px 12px 10px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .room img{width:46px;height:46px;filter:drop-shadow(0 3px 5px #0009)}
  .room .nm{flex:1;min-width:0}
  .room .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .room .nm small{color:var(--muted)}
  .room.mine{border-color:#d6aa5266}
  .empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 0 12px;color:var(--muted)}
  .empty img{width:72px;height:72px;opacity:.25;filter:grayscale(1)}
  .note{text-align:center;color:var(--muted);font-size:.78rem;line-height:1.5}
  .note a{color:var(--muted)}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:10px;z-index:30;box-shadow:0 8px 30px #000a}

  /* ---------- Game ---------- */
  #game{position:relative;display:flex;gap:22px;flex-wrap:wrap;justify-content:center;width:100%;max-width:960px;padding:24px 16px}
  #boardWrap{width:min(92vw,560px)}
  #board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1;border-radius:8px;overflow:hidden;box-shadow:0 14px 40px #000b}
  .sq{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
  .sq.l{background:var(--light)} .sq.d{background:var(--dark)}
  .sq.sel{background:#f6e05e!important}
  .sq.last::after{content:"";position:absolute;inset:0;background:#f6e05e66}
  .sq.hint::before{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:#0006;z-index:2}
  .sq.hint.cap::before{width:92%;height:92%;background:none;border:5px solid #0006}
  .sq.check{box-shadow:inset 0 0 0 4px var(--danger)}
  .sq img{width:92%;height:92%;position:relative;z-index:1;pointer-events:none;-webkit-user-drag:none}
  .player{display:flex;justify-content:space-between;padding:10px 4px;color:var(--muted);font-weight:500}
  .player.turn{color:var(--text)}
  .player.turn::before{content:"●";color:var(--good);margin-right:8px}
  .player{justify-content:flex-start}
  #side{width:min(92vw,260px);display:flex;flex-direction:column;gap:12px}
  #status{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-weight:600}
  #moves{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;height:260px;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:.9rem;color:var(--muted);white-space:pre}
  .sideRow{display:flex;gap:10px}
  .sideRow .btn{flex:1}
  #promo{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20}
  #promo .panel{text-align:center}
  #promo button{background:var(--light);border-radius:10px;margin:4px;padding:6px}
  #promo button img{width:64px;height:64px;display:block}
</style>
</head>
<body>

<section id="lobby">
  <div class="top">
    <div class="brand"><img src="pieces/wN.png" alt=""><h1>homework - your favourite chess site</h1></div>
    <div class="pill" id="online"><span class="dot"></span><span id="onlineText">Connecting…</span></div>
  </div>

  <div class="you"><label for="nameIn">Playing as</label><input id="nameIn" maxlength="16" autocomplete="off" spellcheck="false"></div>

  <div class="panel" id="createPanel">
    <h2>Open a room</h2>
    <div class="create" id="createTiles">
      <button class="tile" id="asWhite"><img src="pieces/wK.png" alt=""><b>White</b></button>
      <button class="tile" id="asBlack"><img src="pieces/bK.png" alt=""><b>Black</b></button>
    </div>
    <div class="waiting hidden" id="waitBox">
      <img id="waitImg" src="pieces/wK.png" alt="">
      <div class="t"><span class="spin"></span>Waiting for a challenger</div>
      <button class="btn ghost" id="cancelBtn">Cancel</button>
    </div>
  </div>

  <div class="panel">
    <h2>Rooms <span id="roomCount"></span></h2>
    <div id="roomList"></div>
  </div>

  <div class="panel hidden" id="livePanel">
    <h2>Live games <span id="liveCount"></span></h2>
    <div id="liveList"></div>
  </div>

  <div class="note">Piece art by Cburnett, <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>, via Wikimedia Commons</div>
</section>

<section id="game" class="hidden">
  <div id="boardWrap">
    <div class="player" id="topPlayer"></div>
    <div id="board"></div>
    <div class="player" id="botPlayer"></div>
  </div>
  <div id="side">
    <div id="status"></div>
    <div id="moves"></div>
    <div class="sideRow">
      <button class="btn danger" id="resignBtn">Resign</button>
      <button class="btn" id="rematchBtn" class="hidden">Rematch</button>
    </div>
    <button class="btn ghost hidden" id="flipBtn">Flip board</button>
    <button class="btn ghost" id="leaveBtn">Back to lobby</button>
  </div>
</section>

<div id="promo" class="hidden"><div class="panel"><h2 style="justify-content:center">Promote to</h2><div id="promoBtns"></div></div></div>
<div id="toast" class="hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const HUB_ID = 'chessgame-lobby-hub-v1';
const pieceSrc = (color, type) => 'pieces/' + color + type.toUpperCase() + '.png';

// ---------- state ----------
let peer = null;             // my identity (random id) – used for the lobby and for games
let hubPeer = null;          // only set on the one page currently acting as the lobby server
let lobbyConn = null, rooms = [], onlineCount = 0;
let myRoom = null;           // {color,name} while I'm waiting for a challenger
let joining = false;
let conn = null, game = null, myColor = null, oppName = 'Opponent';
let selected = null, legal = [], lastMove = null;
let over = false, resultText = '', wantRematch = false, theyWantRematch = false;
let isOwner = false;         // I opened the room, so I relay my game to spectators and the lobby
let spectating = false, viewFlip = false, specNames = {w:'White', b:'Black'};
const spectators = new Set();
let neutralResult = '';

// ---------- nickname ----------
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){} return null; }
const nameIn = $('nameIn');
nameIn.value = store('chessName') || ('Player ' + (1000 + Math.floor(Math.random()*9000)));
nameIn.oninput = () => store('chessName', nameIn.value);
const myName = () => (nameIn.value.trim() || 'Player').slice(0, 16);

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2800);
}

// ---------- lobby server (runs on whichever page grabs the hub id) ----------
const hubConns = new Map(), hubRooms = new Map();
function hubBroadcast(){
  const msg = {t:'rooms', rooms:[...hubRooms.values()], online: hubConns.size};
  hubConns.forEach(c => { try { c.send(msg); } catch(e){} });
}
function hubAccept(c){
  c.on('open', () => { hubConns.set(c.peer, c); hubBroadcast(); });
  c.on('data', d => {
    if (d && d.t === 'open' && (d.color === 'w' || d.color === 'b')) {
      hubRooms.set(c.peer, {id:c.peer, color:d.color, name:String(d.name || 'Player').slice(0,16)});
      hubBroadcast();
    } else if (d && d.t === 'game' && typeof d.fen === 'string' && d.fen.length < 100) {
      const sq = s => (typeof s === 'string' && /^[a-h][1-8]$/.test(s)) ? s : null;
      hubRooms.set(c.peer, {id:c.peer, status:'playing', fen:d.fen,
        white:String(d.white || 'White').slice(0,16), black:String(d.black || 'Black').slice(0,16),
        last: d.last ? {from:sq(d.last.from), to:sq(d.last.to)} : null});
      hubBroadcast();
    } else if (d && d.t === 'close') { hubRooms.delete(c.peer); hubBroadcast(); }
  });
  const gone = () => { hubConns.delete(c.peer); hubRooms.delete(c.peer); hubBroadcast(); };
  c.on('close', gone); c.on('error', gone);
}
function claimHub(done){
  if (hubPeer && !hubPeer.destroyed) return done && done();
  const hp = new Peer(HUB_ID);
  let finished = false;
  const fin = () => { if (!finished) { finished = true; done && done(); } };
  hp.on('open', () => { hubPeer = hp; hp.on('connection', hubAccept); fin(); });
  hp.on('disconnected', () => { if (!hp.destroyed) hp.reconnect(); });
  hp.on('error', e => { if (e.type === 'unavailable-id') hp.destroy(); fin(); });
}

// ---------- lobby client ----------
function connectLobby(){
  if (!peer || peer.destroyed || (game && !isOwner) || lobbyConn) return;
  const c = peer.connect(HUB_ID, {reliable:true, metadata:{kind:'lobby'}});
  lobbyConn = c;
  c.on('open', () => { lobbyAnnounce(); renderLobby(); });
  c.on('data', d => { if (d && d.t === 'rooms') { rooms = d.rooms || []; onlineCount = d.online || 0; renderLobby(); } });
  const lost = () => {
    if (lobbyConn !== c) return;
    lobbyConn = null; rooms = []; onlineCount = 0; renderLobby();
    if (!game || isOwner) setTimeout(() => claimHub(() => setTimeout(connectLobby, 700)), 300 + Math.random()*1200);
  };
  c.on('close', lost); c.on('error', lost);
}
function lobbySend(m){ if (lobbyConn && lobbyConn.open) lobbyConn.send(m); }
const nameOf = c => spectating ? specNames[c] : (c === myColor ? myName() : oppName);
function announceGame(){
  if (!isOwner || !game) return;
  lobbySend({t:'game', fen: game.fen(), white: nameOf('w'), black: nameOf('b'),
    last: lastMove ? {from:lastMove.from, to:lastMove.to} : null});
}
function lobbyAnnounce(){
  if (myRoom) lobbySend({t:'open', color:myRoom.color, name:myRoom.name});
  else if (isOwner && game && !over) announceGame();
}
// ---------- spectator relay (only the room owner does this) ----------
function specBroadcast(m){ spectators.forEach(s => { try { if (s.open) s.send(m); } catch(e){} }); }
function syncMsg(){
  return {t:'sync', white:nameOf('w'), black:nameOf('b'), over, text:neutralResult,
    moves: game.history({verbose:true}).map(m => ({from:m.from, to:m.to, promotion:m.promotion}))};
}
function leaveLobby(){ const c = lobbyConn; lobbyConn = null; if (c) try { c.close(); } catch(e){} }

function initPeer(){
  peer = new Peer();
  peer.on('open', () => claimHub(() => setTimeout(connectLobby, 500)));
  peer.on('connection', onIncomingGame);
  peer.on('disconnected', () => { if (!peer.destroyed) peer.reconnect(); });
  peer.on('error', e => {
    if (e.type === 'peer-unavailable') {
      if (joining) { joining = false; conn = null; toast('That room is no longer open.'); renderLobby(); }
      else { lobbyConn = null; setTimeout(() => claimHub(() => setTimeout(connectLobby, 700)), 400 + Math.random()*1000); }
    } else if (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error') {
      toast('Connection problem. Retrying…');
    }
  });
}

// ---------- rooms ----------
function createRoom(color){
  if (myRoom || joining) return;
  myRoom = {color, name: myName()};
  lobbySend({t:'open', ...myRoom});
  renderLobby();
}
function cancelRoom(){
  myRoom = null; lobbySend({t:'close'}); renderLobby();
}
function joinRoom(id){
  if (joining || myRoom || game) return;
  joining = true; renderLobby();
  const c = peer.connect(id, {reliable:true, metadata:{kind:'game'}});
  conn = c; setupConn(c);
  setTimeout(() => { if (joining && !game) { joining = false; conn = null; try{c.close();}catch(e){} toast('Could not reach that room.'); renderLobby(); } }, 12000);
}
// someone clicked Join on my room
function onIncomingGame(c){
  const kind = c.metadata && c.metadata.kind;
  if (kind === 'spectate') {
    c.on('open', () => {
      if (!game || !isOwner || spectating) { c.send({t:'gone'}); setTimeout(() => c.close(), 300); return; }
      spectators.add(c); c.send(syncMsg()); render();
    });
    c.on('close', () => { spectators.delete(c); if (game && !spectating) render(); });
    return;
  }
  if (kind !== 'game') { c.close(); return; }
  c.on('open', () => {
    if (!myRoom || game) { c.send({t:'full'}); setTimeout(() => c.close(), 300); return; }
    const mine = myRoom.color; myRoom = null;
    isOwner = true;                       // stay connected to the lobby so the game shows up as live
    conn = c; setupConn(c);
    c.send({t:'start', you: mine === 'w' ? 'b' : 'w', name: myName()});
    startGame(mine);
  });
}

// ---------- spectating ----------
function spectate(id){
  if (joining || myRoom || game) return;
  joining = true; renderLobby();
  const c = peer.connect(id, {reliable:true, metadata:{kind:'spectate'}});
  conn = c;
  c.on('data', d => {
    if (!d) return;
    if (d.t === 'gone') { joining = false; conn = null; toast('That game is no longer available.'); renderLobby(); }
    else if (d.t === 'sync') beginSpectate(d);
    else if (spectating && game && d.t === 'smove') {
      const m = game.move({from:d.from, to:d.to, promotion:d.promotion});
      if (m) { lastMove = m; const t = gameOverText(); if (t) { over = true; resultText = t; } render(); }
    } else if (spectating && d.t === 'sover') { over = true; resultText = d.text; render(); }
  });
  c.on('close', () => {
    if (spectating && !over) { over = true; resultText = 'The host left the game.'; render(); }
    else if (!game && conn === c) { conn = null; if (joining) { joining = false; renderLobby(); } }
  });
  setTimeout(() => { if (joining && !game) { joining = false; conn = null; try{c.close();}catch(e){} toast('Could not reach that game.'); renderLobby(); } }, 12000);
}
function beginSpectate(d){
  spectating = true; joining = false; isOwner = false; viewFlip = false;
  leaveLobby();
  game = new Chess();
  (d.moves || []).forEach(m => game.move(m));
  const h = game.history({verbose:true}); lastMove = h[h.length-1] || null;
  specNames = {w:String(d.white || 'White').slice(0,16), b:String(d.black || 'Black').slice(0,16)};
  over = !!d.over; resultText = String(d.text || '');
  selected = null; legal = [];
  $('lobby').classList.add('hidden'); $('game').classList.remove('hidden');
  $('resignBtn').classList.add('hidden'); $('rematchBtn').classList.add('hidden');
  $('flipBtn').classList.remove('hidden');
  render();
}

function miniBoard(fen, last){
  const wrap = document.createElement('div'); wrap.className = 'mini';
  const rows = fen.split(' ')[0].split('/');
  for (let r = 0; r < 8; r++) {
    let f = 0;
    for (const ch of (rows[r] || '')) {
      if (/\d/.test(ch)) { for (let k = 0; k < +ch; k++) wrap.appendChild(miniCell(r, f++, null, last)); }
      else wrap.appendChild(miniCell(r, f++, ch, last));
    }
  }
  return wrap;
}
function miniCell(r, f, ch, last){
  const i = document.createElement('i');
  const name = 'abcdefgh'[f] + (8 - r);
  i.className = ((f + r) % 2 === 0 ? 'l' : 'd') + (last && (last.from === name || last.to === name) ? ' last' : '');
  if (ch) {
    const im = document.createElement('img');
    im.src = pieceSrc(ch === ch.toUpperCase() ? 'w' : 'b', ch.toLowerCase()); im.alt = '';
    i.appendChild(im);
  }
  return i;
}

function renderLobby(){
  const live = lobbyConn && lobbyConn.open;
  $('online').classList.toggle('on', !!live);
  $('onlineText').textContent = live ? onlineCount + ' online' : 'Connecting…';

  $('createTiles').classList.toggle('hidden', !!myRoom);
  $('waitBox').classList.toggle('hidden', !myRoom);
  $('asWhite').disabled = $('asBlack').disabled = joining;
  if (myRoom) $('waitImg').src = pieceSrc(myRoom.color, 'k');

  const list = $('roomList'); list.innerHTML = '';
  const mineId = peer && peer.id;
  const liveGames = rooms.filter(r => r.status === 'playing' && r.id !== mineId);
  $('livePanel').classList.toggle('hidden', !liveGames.length);
  $('liveCount').textContent = liveGames.length || '';
  const ll = $('liveList'); ll.innerHTML = '';
  liveGames.forEach(g => {
    const card = document.createElement('div'); card.className = 'live';
    const vs = document.createElement('div'); vs.className = 'vs';
    const a = document.createElement('span'); a.textContent = g.white;
    const m = document.createElement('em'); m.textContent = 'vs';
    const b = document.createElement('span'); b.textContent = g.black;
    vs.append(a, m, b);
    const btn = document.createElement('button'); btn.className = 'btn'; btn.textContent = 'Watch';
    btn.disabled = joining || !!myRoom;
    btn.onclick = () => spectate(g.id);
    card.append(miniBoard(g.fen, g.last), vs, btn);
    ll.appendChild(card);
  });

  const visible = rooms.filter(r => r.status !== 'playing' && (r.id !== mineId || myRoom));
  $('roomCount').textContent = visible.length ? visible.length : '';
  if (!visible.length) {
    const e = document.createElement('div'); e.className = 'empty';
    e.innerHTML = '<img src="pieces/bN.png" alt=""><div>No open rooms</div>';
    if (liveGames.length) e.querySelector('div').textContent = 'No open rooms. Watch a live game below.';
    list.appendChild(e); return;
  }
  visible.forEach(r => {
    const isMine = r.id === mineId;
    const row = document.createElement('div'); row.className = 'room' + (isMine ? ' mine' : '');
    const img = document.createElement('img'); img.src = pieceSrc(r.color, 'k'); img.alt = '';
    const nm = document.createElement('div'); nm.className = 'nm';
    const b = document.createElement('b'); b.textContent = isMine ? 'Your room' : r.name;
    const s = document.createElement('small'); s.textContent = isMine ? 'Waiting…' : ('plays ' + (r.color === 'w' ? 'White' : 'Black'));
    nm.append(b, s);
    row.append(img, nm);
    if (!isMine) {
      const btn = document.createElement('button'); btn.className = 'btn'; btn.textContent = 'Join';
      btn.disabled = joining || !!myRoom;
      btn.onclick = () => joinRoom(r.id);
      row.append(btn);
    }
    list.appendChild(row);
  });
}

// ---------- game connection ----------
function setupConn(c){
  c.on('data', onData);
  c.on('close', () => {
    if (game && !over && conn === c) endGame('Opponent disconnected.', oppName + ' disconnected.');
    else if (!game && conn === c) { conn = null; if (joining) { joining = false; renderLobby(); } }
  });
}

function startGame(color){
  myColor = color;
  game = new Chess();
  joining = false; spectating = false;
  selected = null; legal = []; lastMove = null;
  over = false; resultText = ''; neutralResult = ''; wantRematch = theyWantRematch = false;
  $('lobby').classList.add('hidden');
  $('game').classList.remove('hidden');
  $('rematchBtn').classList.add('hidden');
  $('flipBtn').classList.add('hidden');
  $('resignBtn').classList.remove('hidden');
  if (isOwner) { announceGame(); specBroadcast(syncMsg()); }
  render();
}

function onData(d){
  if (!d) return;
  if (!game) {
    if (d.t === 'start') {
      oppName = String(d.name || 'Opponent').slice(0,16);
      isOwner = false;
      leaveLobby();
      startGame(d.you);
      conn.send({t:'hello', name: myName()});
    } else if (d.t === 'full') {
      joining = false; conn = null; toast('Someone else just took that room.'); renderLobby();
    }
    return;
  }
  if (d.t === 'hello') {
    oppName = String(d.name || 'Opponent').slice(0,16);
    if (isOwner) { announceGame(); specBroadcast(syncMsg()); }
    render();
  }
  else if (d.t === 'move' && !over) {
    const m = game.move({from:d.from, to:d.to, promotion:d.promotion});
    if (m) { lastMove = m; selected = null; legal = []; relayMove(m); afterMove(); }
  } else if (d.t === 'resign') endGame('Opponent resigned. You win!', oppName + ' resigned.');
  else if (d.t === 'rematch') {
    theyWantRematch = true;
    if (wantRematch) startGame(myColor === 'w' ? 'b' : 'w'); else render();
  }
}

function gameOverText(){
  if (game.in_checkmate()) return 'Checkmate — ' + (game.turn()==='w' ? 'Black' : 'White') + ' wins!';
  if (game.in_stalemate()) return 'Draw by stalemate.';
  if (game.insufficient_material()) return 'Draw — insufficient material.';
  if (game.in_threefold_repetition()) return 'Draw by repetition.';
  if (game.in_draw()) return 'Draw.';
  return null;
}
// after any move: tell spectators and update the lobby preview
function relayMove(m){
  if (!isOwner) return;
  specBroadcast({t:'smove', from:m.from, to:m.to, promotion:m.promotion});
  announceGame();
}
function afterMove(){
  const t = gameOverText();
  if (t) endGame(t); else render();
}

function endGame(text, neutral){
  over = true; resultText = text; neutralResult = neutral || text;
  if (isOwner) { specBroadcast({t:'sover', text: neutralResult}); lobbySend({t:'close'}); }
  $('resignBtn').classList.add('hidden');
  if (conn && conn.open) $('rematchBtn').classList.remove('hidden');
  render();
}

function tryMove(from, to){
  const cands = legal.filter(m => m.to === to);
  if (!cands.length) return;
  const finish = promotion => {
    const m = game.move({from, to, promotion});
    if (!m) return;
    lastMove = m; selected = null; legal = [];
    conn.send({t:'move', from, to, promotion});
    relayMove(m);
    afterMove();
  };
  if (cands[0].promotion) {
    const box = $('promoBtns'); box.innerHTML = '';
    ['q','r','b','n'].forEach(p => {
      const b = document.createElement('button');
      const im = document.createElement('img'); im.src = pieceSrc(myColor, p); im.alt = p;
      b.appendChild(im);
      b.onclick = () => { $('promo').classList.add('hidden'); finish(p); };
      box.appendChild(b);
    });
    $('promo').classList.remove('hidden');
  } else finish(undefined);
}

function clickSquare(name){
  if (spectating || over || game.turn() !== myColor) return;
  if (selected && legal.some(m => m.to === name)) { tryMove(selected, name); return; }
  const p = game.get(name);
  if (p && p.color === myColor) { selected = name; legal = game.moves({square:name, verbose:true}); }
  else { selected = null; legal = []; }
  render();
}

function findKing(color){
  for (const row of game.board()) for (const p of row) if (p && p.type==='k' && p.color===color) return p.square;
}

function render(){
  const board = $('board'); board.innerHTML = '';
  const viewColor = spectating ? (viewFlip ? 'b' : 'w') : myColor;
  const flip = viewColor === 'b';
  const kingSq = game.in_check() ? findKing(game.turn()) : null;
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const rank = flip ? r + 1 : 8 - r;
    const file = flip ? 7 - f : f;
    const name = 'abcdefgh'[file] + rank;
    const sq = document.createElement('div');
    sq.className = 'sq ' + ((file + rank) % 2 === 1 ? 'l' : 'd');
    if (name === selected) sq.classList.add('sel');
    if (lastMove && (name === lastMove.from || name === lastMove.to)) sq.classList.add('last');
    const mv = legal.find(m => m.to === name);
    if (mv) { sq.classList.add('hint'); if (game.get(name) || mv.flags.includes('e')) sq.classList.add('cap'); }
    if (name === kingSq) sq.classList.add('check');
    const p = game.get(name);
    if (p) { const im = document.createElement('img'); im.src = pieceSrc(p.color, p.type); im.alt = ''; im.draggable = false; sq.appendChild(im); }
    sq.onclick = () => clickSquare(name);
    board.appendChild(sq);
  }

  const oppColor = viewColor === 'w' ? 'b' : 'w';
  const label = c => c === 'w' ? 'White' : 'Black';
  $('botPlayer').textContent = nameOf(viewColor) + ' (' + label(viewColor) + ')';
  $('topPlayer').textContent = nameOf(oppColor) + ' (' + label(oppColor) + ')';
  $('botPlayer').classList.toggle('turn', !over && game.turn() === viewColor);
  $('topPlayer').classList.toggle('turn', !over && game.turn() !== viewColor);

  let status;
  if (spectating) {
    status = over ? resultText : nameOf(game.turn()) + ' to move' + (game.in_check() ? ' (check)' : '');
    status = 'Watching · ' + status;
  } else if (over) status = resultText + (wantRematch ? ' Waiting for opponent…' : theyWantRematch ? ' Opponent wants a rematch!' : '');
  else if (game.turn() === myColor) status = 'Your move' + (game.in_check() ? ' — you are in check!' : '');
  else status = "Opponent's move" + (game.in_check() ? ' (check)' : '');
  if (!spectating && spectators.size) status += ' · ' + spectators.size + ' watching';
  $('status').textContent = status;

  const h = game.history(); let out = '';
  for (let i = 0; i < h.length; i += 2) out += (i/2+1) + '. ' + h[i] + ' ' + (h[i+1] || '') + '\n';
  $('moves').textContent = out; $('moves').scrollTop = 1e6;
}

// ---------- buttons ----------
$('asWhite').onclick = () => createRoom('w');
$('asBlack').onclick = () => createRoom('b');
$('cancelBtn').onclick = cancelRoom;
$('resignBtn').onclick = () => {
  if (!confirm('Resign this game?')) return;
  conn.send({t:'resign'}); endGame('You resigned.', myName() + ' resigned.');
};
$('rematchBtn').onclick = () => {
  if (!conn || !conn.open) return;
  wantRematch = true; conn.send({t:'rematch'});
  if (theyWantRematch) startGame(myColor === 'w' ? 'b' : 'w'); else render();
};
$('flipBtn').onclick = () => { viewFlip = !viewFlip; render(); };
$('leaveBtn').onclick = () => location.reload();
window.addEventListener('beforeunload', () => { try { if (peer) peer.destroy(); if (hubPeer) hubPeer.destroy(); } catch(e){} });

$('rematchBtn').classList.add('hidden');
renderLobby();
initPeer();
</script>
